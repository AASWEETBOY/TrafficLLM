data_config:
  train_file: GLM4_instructions_train.jsonl
  val_file: GLM4_instructions_test_with_label.jsonl
  test_file: GLM4_instructions_test_with_label.jsonl
  num_proc: 1

combine: True
max_input_length: 512
max_output_length: 512

training_args:
  do_train: True
  # see `transformers.Seq2SeqTrainingArguments`
  output_dir: ../models/glm-4-9b-chat-lora/instructions
  max_steps: 20000
  bf16: true
  # fp16: false
  # needed to be fit for the dataset
  learning_rate: 5e-5
  # settings for data loading
  per_device_train_batch_size: 1
  dataloader_num_workers: 16
  remove_unused_columns: false
  # false
  # settings for saving checkpoints
  save_strategy: steps
  save_steps: 500
  # settings for logging
  # logging_dir: ./output/logs
  log_level: info
  logging_strategy: steps
  logging_steps: 100
  # settings for evaluation
  do_eval: False
  evaluation_strategy: no
  per_device_eval_batch_size: 1
  eval_strategy: steps
  eval_steps: 10
  # settings for optimizer
  # adam_epsilon: 1e-6
  # uncomment the following line to detect nan or inf values
  # debug: underflow_overflow
  predict_with_generate: true
  # see `transformers.GenerationConfig`
  generation_config:
    max_new_tokens: 512
  # set your absolute deepspeed path here
  # deepspeed: configs/ds.json
peft_config:
  peft_type: LORA
  task_type: CAUSAL_LM
  r: 8
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules: ["query_key_value"]
